[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[edge_functions]]
  path = "/blog/*"
  function = "social-meta"

[[redirects]]
  from = "/api/views"
  to = "/.netlify/functions/increment-views"
  status = 200

[[redirects]]
  from = "/portfolio/*"
  to = "/work/:splat"
  status = 301

[[redirects]]
  from = "/portfolio"
  to = "/work"
  status = 301

[[redirects]]
  from = "/quote"
  to = "/estimate"
  status = 301

[[redirects]]
  from = "/spa-burn"
  to = "/spa-bern"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
